# On every pull request: render the screens, score them with the harness, and send the new parts
# the AI labelled to the triage list (GitHub Issues with the label "triage").
# The harness never blocks the merge for a new part: it goes to triage, where the design system owner decides.
name: Harness and triage
on:
  pull_request:
    paths: ['screens/**', 'src/**', 'contracts/**', 'components.css', 'tokens.css', 'harness/**', '.github/workflows/triage.yml']
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Decision map is up to date
        run: python3 build-map.py && git diff --exit-code decision-map.md
      - name: System checks (tokens, contrast, names)
        run: node harness/system.mjs
      - name: Render the screens
        run: npm run render -- screens
      - name: Harness
        run: npm run typecheck:screens -- screens && node harness/score.mjs screens
      - name: Collect new parts
        run: node harness/triage.mjs screens --out triage-out
      - name: Send them to the triage list
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: node harness/triage-to-issues.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
